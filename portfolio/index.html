<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your Name | Graphic Designer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      color: #111;
      background: #fff;
    }

    a { color: #111; }

    .layout {
      display: flex;
      align-items: flex-start;
    }

    .sidebar {
      flex: 0 0 220px;
      position: sticky;
      top: 0;
      height: 100vh;
      box-sizing: border-box;
      padding: 2rem 1.5rem;
      border-right: 1px solid #e5e5e5;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .sidebar .logo img {
      height: 100px;
      width: auto;
      display: block;
    }

    .sidebar nav {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .sidebar nav a { text-decoration: none; }
    .sidebar nav a:hover { text-decoration: underline; }

    main {
      flex: 1;
      min-width: 0;
      padding: 2rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1rem;
    }

    .grid a {
      position: relative;
      display: block;
      overflow: hidden;
      aspect-ratio: 4 / 3;
    }

    .grid a img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      box-sizing: border-box;
      text-align: center;
      background: rgba(0, 0, 0, 0.6);
      transform: translateY(-100%);
      transition: transform 0.4s ease;
    }

    .grid a:hover .overlay {
      transform: translateY(0);
    }

    .title {
      color: #fff;
      font-size: 1.25rem;
      font-weight: bold;
      opacity: 0;
      transform: translateY(-40px);
      transition: opacity 0.4s ease 0.15s, transform 0.4s ease 0.15s;
    }

    .grid a:hover .title {
      opacity: 1;
      transform: translateX(0);
    }

    @media (hover: none) {
      .overlay { transform: translateX(0); }
      .title { opacity: 1; transform: translateX(0); }
    }

    .brands {
      margin-top: 3rem;
    }

    .brands h2 {
      margin: 0 0 1rem;
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .marquee {
      overflow: hidden;
      border-top: 1px solid #e5e5e5;
      border-bottom: 1px solid #e5e5e5;
      padding: 1.5rem 0;
    }

    .track {
      display: flex;
      align-items: center;
      width: max-content;
      animation: scroll 20s linear infinite;
    }

    /* Wrap images in elements to keep spacing math identical */
    .marquee-item {
      display: block;
      flex-shrink: 0;
      padding-right: 5rem; 
    }

    .marquee-item img {
      height: 80px;
      width: 200;
      display: block;
    }

    @keyframes scroll {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }

    @media (prefers-reduced-motion: reduce) {
      .track { animation: none; }
    }
  </style>
</head>
<body>

  <div class="layout">

    <aside class="sidebar">
      <a href="index.html" class="logo">
        <img src="images/logo.svg" alt="Your Name logo">
      </a>
      <nav>
        <a href="index.html">Work</a>
        <a href="about.html">About</a>
        <a href="mailto:you@email.com">Contact</a>
      </nav>
    </aside>

    <main>
      <section class="grid">
        <a href="linus-tech-tips.html">
          <img src="images/image-1.jpg" alt="Linus Tech Tips">
          <span class="overlay"><span class="title">Linus Tech Tips</span></span>
        </a>
        <a href="bdo-canada.html">
          <img src="images/image-2.jpg" alt="BDO Canada">
          <span class="overlay"><span class="title">BDO Canada</span></span>
        </a>
        <a href="london-knights.html">
          <img src="images/image-3.jpg" alt="London Knights">
          <span class="overlay"><span class="title">London Knights</span></span>
        </a>
      </section>

      <section class="brands">
        <h2>Brands I've worked with</h2>
        <div class="marquee">
          <div class="track">
            <!-- Set 1 -->
            <div class="marquee-item"><img src="svgs/brand-1.svg" alt="Brand 1"></div>
            <div class="marquee-item"><img src="svgs/brand-2.svg" alt="BDO Canada"></div>
            <div class="marquee-item"><img src="svgs/brand-3.svg" alt="London Knights"></div>
            <div class="marquee-item"><img src="svgs/brand-4.svg" alt="Creator Warehouse"></div>
            <div class="marquee-item"><img src="svgs/brand-5.svg" alt="Brand 5"></div>
            <div class="marquee-item"><img src="svgs/brand-6.svg" alt="Brand 6"></div>
            <div class="marquee-item"><img src="svgs/brand-7.svg" alt="Brand 7"></div>
            <div class="marquee-item"><img src="svgs/brand-8.svg" alt="Brand 8"></div>
            
            <!-- Set 2 -->
            <div class="marquee-item"><img src="svgs/brand-1.svg" alt="Brand 1"></div>
            <div class="marquee-item"><img src="svgs/brand-2.svg" alt="BDO Canada"></div>
            <div class="marquee-item"><img src="svgs/brand-3.svg" alt="London Knights"></div>
            <div class="marquee-item"><img src="svgs/brand-4.svg" alt="Creator Warehouse"></div>
            <div class="marquee-item"><img src="svgs/brand-5.svg" alt="Brand 5"></div>
            <div class="marquee-item"><img src="svgs/brand-6.svg" alt="Brand 6"></div>
            <div class="marquee-item"><img src="svgs/brand-7.svg" alt="Brand 7"></div>
            <div class="marquee-item"><img src="svgs/brand-8.svg" alt="Brand 8"></div>
          </div>
        </div>
      </section>
    </main>
  </div>

</body>
</html>
